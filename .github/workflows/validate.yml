name: Validate Domains

on:
  pull_request:
    paths:
      - "domains/**"
      - "reserved.json"
      - "scripts/validate.js"

  push:
    branches:
      - main
    paths:
      - "domains/**"
      - "reserved.json"
      - "scripts/validate.js"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Records
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate DNS records
        run: node scripts/validate.js
